<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>هات — لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #FF6B35;
      --primary-glow: rgba(255,107,53,0.25);
      --accent: #FFD166;
      --success: #06D6A0;
      --warning: #FFD166;
      --danger: #EF476F;
      --info: #4CC9F0;
      --dark: #0A0A0F;
      --dark2: #111118;
      --dark3: #18181F;
      --surface: #1E1E28;
      --surface2: #252530;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #F0F0F5;
      --text-muted: #7A7A8C;
      --text-dim: #4A4A5A;
      --radius: 16px;
      --radius-sm: 10px;
      --sidebar-w: 260px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      background: var(--dark);
      color: var(--text);
    }

    /* ===== SIDEBAR TOGGLE ===== */
    .sidebar-toggle {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      right: calc(var(--sidebar-w) - 1px);
      width: 20px;
      height: 52px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-left: none;
      border-radius: 0 10px 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 200;
      transition: right 0.3s cubic-bezier(0.4,0,0.2,1), background 0.2s;
      color: var(--text-muted);
      font-size: 12px;
      user-select: none;
    }
    .sidebar-toggle:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .sidebar-toggle.collapsed { right: -1px; border-radius: 0 10px 10px 0; }
    .sidebar.collapsed { width: 0; overflow: hidden; border: none; }

    /* ===== LAYOUT ===== */
    .layout { display: flex; height: 100vh; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--dark2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.3s cubic-bezier(0.4,0,0.2,1);
      position: relative;
    }

    .sidebar-top { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .brand-icon {
      width: 44px; height: 44px;
      background: var(--primary);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 20px var(--primary-glow);
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #FF6B35, #FFD166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .brand-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(6,214,160,0.08);
      border: 1px solid rgba(6,214,160,0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--success);
      font-weight: 600;
    }
    .live-pulse {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 0 rgba(6,214,160,0.5);
      animation: livePing 1.5s ease infinite;
    }
    @keyframes livePing {
      0%   { box-shadow: 0 0 0 0 rgba(6,214,160,0.6); }
      70%  { box-shadow: 0 0 0 8px rgba(6,214,160,0); }
      100% { box-shadow: 0 0 0 0 rgba(6,214,160,0); }
    }

    /* STATS */
    .stats-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .stats-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; font-weight: 700; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      transition: all 0.2s;
    }
    .stat-card:hover { border-color: var(--border2); background: var(--surface2); }
    .stat-num { font-size: 26px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
    .stat-lbl { font-size: 11px; color: var(--text-muted); font-weight: 600; }

    /* FILTERS */
    .filter-section { padding: 16px 20px; flex: 1; }
    .filter-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: 700; }
    .filter-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-family: 'Cairo', sans-serif;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.2s;
      margin-bottom: 4px;
      text-align: right;
    }
    .filter-btn:hover { background: var(--surface); color: var(--text); }
    .filter-btn.active { background: rgba(255,107,53,0.12); color: var(--primary); border: 1px solid rgba(255,107,53,0.2); }
    .filter-count {
      margin-right: auto;
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 24px;
      text-align: center;
    }
    .filter-btn.active .filter-count { background: rgba(255,107,53,0.2); color: var(--primary); }

    /* ===== MAIN ===== */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--dark3); }

    /* TOP BAR */
    .topbar {
      padding: 16px 20px;
      background: var(--dark2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 10px 42px 10px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      outline: none;
      color: var(--text);
      transition: all 0.2s;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--primary); background: rgba(255,107,53,0.04); box-shadow: 0 0 0 3px var(--primary-glow); }

    .topbar-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .count-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* ORDERS GRID */
    .orders-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
      align-content: start;
    }
    .orders-area::-webkit-scrollbar { width: 4px; }
    .orders-area::-webkit-scrollbar-track { background: transparent; }
    .orders-area::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

    /* ORDER CARD */
    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      border-right: 3px solid transparent;
      position: relative;
      overflow: hidden;
    }
    .order-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.02), transparent);
      pointer-events: none;
    }
    .order-card:hover {
      border-color: var(--border2);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .order-card.selected {
      border-color: var(--primary) !important;
      background: rgba(255,107,53,0.06);
      box-shadow: 0 0 0 1px rgba(255,107,53,0.2);
    }

    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-id {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      background: rgba(255,107,53,0.1);
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .card-status {
      padding: 3px 10px;
      font-size: 11px;
      border-radius: 20px;
      font-weight: 700;
    }
    .card-name { font-weight: 800; font-size: 15px; color: var(--text); margin-bottom: 6px; }
    .card-cat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--dark3);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .card-phone { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .card-time { font-size: 11px; color: var(--text-dim); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

    @keyframes newFlash {
      0%   { box-shadow: 0 0 0 4px rgba(255,209,102,0.6), 0 8px 24px rgba(0,0,0,0.3); }
      100% { box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    }
    .order-card.new-flash { animation: newFlash 2s ease; }

    /* EMPTY */
    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.5; }
    .empty-text { font-size: 15px; font-weight: 600; }

    /* ===== DETAIL PANEL ===== */
    .detail-panel {
      width: 340px;
      background: var(--dark2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .detail-panel.hidden { display: none; }

    .detail-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: var(--dark2);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .detail-head-title { font-size: 14px; font-weight: 800; color: var(--text); }
    .detail-close {
      width: 32px; height: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
      transition: all 0.2s;
    }
    .detail-close:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .detail-body::-webkit-scrollbar { width: 3px; }
    .detail-body::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    .detail-order-id {
      font-size: 22px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .info-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 12px;
    }
    .info-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-row:first-child { padding-top: 0; }
    .info-key { color: var(--text-muted); flex-shrink: 0; font-weight: 600; }
    .info-val { color: var(--text); font-weight: 700; line-height: 1.5; }

    .section-head {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 16px 0 8px;
    }

    .status-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .status-btn {
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Cairo', sans-serif;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      transition: all 0.2s;
      font-weight: 600;
    }
    .status-btn:hover { border-color: var(--border2); color: var(--text); }
    .status-btn.active { font-weight: 800; }

    .note-textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      outline: none;
      min-height: 85px;
      resize: vertical;
      color: var(--text);
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .note-textarea::placeholder { color: var(--text-muted); }
    .note-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

    .btn-save {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: all 0.2s;
    }
    .btn-save:hover { background: #e85520; box-shadow: 0 4px 15px var(--primary-glow); }

    .btn-delete {
      width: 100%;
      padding: 11px;
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(239,71,111,0.3);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-delete:hover { background: rgba(239,71,111,0.1); border-color: var(--danger); }

    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    /* TIMELINE */
    .tl-item {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-dot-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-top: 5px; }
    .tl-msg { font-size: 12px; font-weight: 700; color: var(--text); }
    .tl-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ===== MOBILE RESPONSIVE ===== */
    @media (max-width: 768px) {
      .sidebar.collapsed { display: none; }
      .sidebar-toggle {
        right: 0 !important;
        left: auto !important;
        border-radius: 10px 0 0 10px !important;
        border-right: none !important;
        border-left: 1px solid var(--border2) !important;
      }
      .sidebar-toggle.collapsed { right: 0 !important; }

      .detail-panel {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 500;
        border: none !important;
        border-radius: 0 !important;
        overflow-y: auto;
      }
      .detail-panel.hidden { display: none !important; }

      .detail-head {
        padding: 16px 20px;
        background: var(--dark2);
      }

      .orders-area {
        grid-template-columns: 1fr;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-icon">🛵</div>
        <div>
          <div class="brand-name">هات</div>
          <div class="brand-sub">لوحة التحكم</div>
        </div>
      </div>
      <div class="live-pill">
        <div class="live-pulse"></div>
        متصل الآن
      </div>
    </div>

    <div class="stats-section">
      <div class="stats-label">إحصائيات</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num" id="st-all" style="color:var(--primary)">0</div>
          <div class="stat-lbl">إجمالي</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="st-pending" style="color:var(--warning)">0</div>
          <div class="stat-lbl">انتظار</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="st-preparing" style="color:var(--info)">0</div>
          <div class="stat-lbl">في الطريق</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="st-ready" style="color:var(--success)">0</div>
          <div class="stat-lbl">تم التسليم</div>
        </div>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-label">تصفية الطلبات</div>
      <button class="filter-btn active" data-filter="all">📋 الكل <span class="filter-count" id="fc-all">0</span></button>
      <button class="filter-btn" data-filter="pending">✅ تم الاستلام <span class="filter-count" id="fc-pending">0</span></button>
      <button class="filter-btn" data-filter="preparing">🍳 جاري التحضير <span class="filter-count" id="fc-preparing">0</span></button>
      <button class="filter-btn" data-filter="ready">🛵 في الطريق <span class="filter-count" id="fc-ready">0</span></button>
      <button class="filter-btn" data-filter="delivered">📦 تسليم <span class="filter-count" id="fc-delivered">0</span></button>
      <button class="filter-btn" data-filter="cancelled">❌ ملغي <span class="filter-count" id="fc-cancelled">0</span></button>
    </div>
  </div>

  <div class="sidebar-toggle" id="sidebar-toggle">❮</div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="text" id="search-input" placeholder="ابحث بالاسم أو رقم الطلب أو الهاتف..."/>
      </div>
      <div class="topbar-meta">
        <span class="count-badge" id="results-count">0 طلب</span>
      </div>
    </div>

    <div class="orders-area" id="orders-grid">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div class="empty-text">جاري التحميل...</div>
      </div>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel hidden" id="detail-panel">
    <div class="detail-head">
      <div class="detail-head-title">تفاصيل الطلب</div>
      <div class="detail-close" id="close-detail-btn">✕</div>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, updateDoc, deleteDoc, arrayUnion }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUUGgom_UK8CkxJS9KeXijXPQksTSEzCI",
  authDomain: "orderpro-1b31f.firebaseapp.com",
  projectId: "orderpro-1b31f",
  storageBucket: "orderpro-1b31f.firebasestorage.app",
  messagingSenderId: "583829954540",
  appId: "1:583829954540:web:9f84fbe38dee83ce27aac9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const STATUS = {
  pending:   { bg:'rgba(255,209,102,0.15)', text:'#FFD166', border:'rgba(255,209,102,0.3)', label:'✅ تم استلام طلبك' },
  preparing: { bg:'rgba(76,201,240,0.15)',  text:'#4CC9F0', border:'rgba(76,201,240,0.3)',  label:'🍳 جاري تحضير طلبك' },
  ready:     { bg:'rgba(255,107,53,0.15)',  text:'#FF6B35', border:'rgba(255,107,53,0.3)',  label:'🛵 طلبك في طريقه ليك' },
  delivered: { bg:'rgba(6,214,160,0.15)',   text:'#06D6A0', border:'rgba(6,214,160,0.3)',   label:'📦 تم التسليم' },
  cancelled: { bg:'rgba(239,71,111,0.12)',  text:'#EF476F', border:'rgba(239,71,111,0.2)',  label:'❌ ملغي' },
};

let allOrders = [], currentFilter = 'all', selectedId = null;
let unsubOrders = null, knownIds = new Set(), isFirstLoad = true;

function nowStr() { return new Date().toLocaleString('ar-EG'); }

// ===== RENDER ORDERS =====
function renderOrders() {
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  const counts = { all: allOrders.length, pending:0, preparing:0, ready:0, delivered:0, cancelled:0 };
  allOrders.forEach(o => { counts[o.status] = (counts[o.status]||0) + 1; });

  ['all','pending','preparing','ready','delivered','cancelled'].forEach(k => {
    const el = document.getElementById('fc-' + k);
    if (el) el.textContent = counts[k] || 0;
  });
  document.getElementById('st-all').textContent     = counts.all;
  document.getElementById('st-pending').textContent = counts.pending || 0;
  document.getElementById('st-preparing').textContent = counts.preparing || 0;
  document.getElementById('st-ready').textContent   = (counts.ready||0) + (counts.delivered||0);

  const filtered = allOrders.filter(o => {
    const mf = currentFilter === 'all' || o.status === currentFilter;
    const ms = !search || o.name?.toLowerCase().includes(search)
      || o.id.toLowerCase().includes(search) || o.phone?.includes(search);
    return mf && ms;
  });

  document.getElementById('results-count').textContent = filtered.length + ' طلب';
  const grid = document.getElementById('orders-grid');

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📭</div>
      <div class="empty-text">لا توجد طلبات</div>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(o => {
    const s = STATUS[o.status] || STATUS.pending;
    const borderColor = {
      pending: '#FFD166', preparing: '#4CC9F0',
      ready: '#06D6A0', delivered: '#888', cancelled: '#EF476F'
    }[o.status] || '#FF6B35';

    return `<div class="order-card ${selectedId===o.id?'selected':''}" data-id="${o.id}"
      style="border-right-color:${borderColor}">
      <div class="card-top">
        <span class="card-id">#${o.id.substring(0,8).toUpperCase()}</span>
        <span class="card-status" style="background:${s.bg};color:${s.text};border:1px solid ${s.border}">${s.label}</span>
      </div>
      <div class="card-name">${o.name||''}</div>
      <div class="card-cat">🗂 ${o.category||o.service||''}</div>
      <div class="card-phone">📞 ${o.phone||''}</div>
      <div class="card-time">🕒 ${o.createdAt||''}</div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.order-card').forEach(card => {
    card.addEventListener('click', () => {
      selectedId = card.dataset.id;
      const order = allOrders.find(o => o.id === selectedId);
      if (order) {
        document.getElementById('detail-panel').classList.remove('hidden');
        renderDetail(order);
        renderOrders();
      }
    });
  });
}

// ===== RENDER DETAIL =====
function renderDetail(o) {
  const s = STATUS[o.status] || STATUS.pending;

  const statusBtns = Object.entries(STATUS).map(([k, v]) => {
    const isActive = o.status === k;
    return `<button class="status-btn ${isActive?'active':''}" data-status="${k}"
      style="${isActive?`background:${v.bg};color:${v.text};border-color:${v.border}`:''}">${v.label}</button>`;
  }).join('');

  const tlHtml = (o.timeline||[]).slice().reverse().map(t =>
    `<div class="tl-item">
      <div class="tl-dot-col"><div class="tl-dot"></div></div>
      <div><div class="tl-msg">${t.msg}</div><div class="tl-time">${t.time}</div></div>
    </div>`
  ).join('');

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-order-id">#${o.id.substring(0,8).toUpperCase()}</div>

    <div class="info-block">
      <div class="info-row"><span class="info-key">👤</span><span class="info-val">${o.name||''}</span></div>
      <div class="info-row"><span class="info-key">📞</span><span class="info-val">${o.phone||''}</span></div>
      <div class="info-row"><span class="info-key">📍</span><span class="info-val">${o.address||''}</span></div>
    </div>

    <div class="info-block">
      <div class="info-row"><span class="info-key">🗂</span><span class="info-val">${o.category||o.service||''}</span></div>
      <div class="info-row"><span class="info-key">🛒</span><span class="info-val">${o.items||o.description||''}</span></div>
      ${o.note ? `<div class="info-row"><span class="info-key">📝</span><span class="info-val">${o.note}</span></div>` : ''}
    </div>

    <div class="section-head">تغيير الحالة</div>
    <div class="status-btns">${statusBtns}</div>

    <div class="divider"></div>
    <div class="section-head">ملاحظة للعميل</div>
    <textarea class="note-textarea" id="note-input" placeholder="اكتب ملاحظة للعميل...">${o.notes||''}</textarea>
    <button class="btn-save" id="save-note-btn">💾 حفظ الملاحظة</button>

    <div class="divider"></div>
    <div class="section-head">سجل الطلب</div>
    <div style="margin-top:4px">${tlHtml||'<div style="color:var(--text-muted);font-size:13px;padding:8px 0">لا يوجد سجل بعد</div>'}</div>

    <div class="divider"></div>
    <button class="btn-delete" id="delete-order-btn">🗑 حذف الطلب</button>
  `;

  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await updateDoc(doc(db, 'orders', o.id), {
          status: btn.dataset.status,
          timeline: arrayUnion({ time: nowStr(), msg: 'تم تغيير الحالة إلى: ' + STATUS[btn.dataset.status].label })
        });
      } catch(e) { alert('خطأ: ' + e.message); }
    });
  });

  document.getElementById('save-note-btn').addEventListener('click', async () => {
    const note = document.getElementById('note-input').value || '';
    try {
      await updateDoc(doc(db, 'orders', o.id), {
        notes: note,
        timeline: arrayUnion({ time: nowStr(), msg: '📝 تمت إضافة ملاحظة للعميل' })
      });
    } catch(e) { alert('خطأ: ' + e.message); }
  });

  document.getElementById('delete-order-btn').addEventListener('click', async () => {
    if (!confirm('هل تريد حذف هذا الطلب نهائياً؟')) return;
    try {
      await deleteDoc(doc(db, 'orders', o.id));
      selectedId = null;
      document.getElementById('detail-panel').classList.add('hidden');
    } catch(e) { alert('خطأ: ' + e.message); }
  });
}

// ===== FIREBASE =====
function startListening() {
  document.getElementById('orders-grid').innerHTML = `<div class="empty-state">
    <div class="empty-icon">⏳</div>
    <div class="empty-text">جاري التحميل...</div>
  </div>`;

  unsubOrders = onSnapshot(collection(db, 'orders'), snapshot => {
    const newOrders = [];
    snapshot.forEach(d => newOrders.push({ id: d.id, ...d.data() }));
    newOrders.sort((a, b) => (b.createdAtTs?.seconds||0) - (a.createdAtTs?.seconds||0));

    if (!isFirstLoad) {
      newOrders.forEach(o => {
        if (!knownIds.has(o.id)) {
          setTimeout(() => {
            const card = document.querySelector(`[data-id="${o.id}"]`);
            if (card) card.classList.add('new-flash');
          }, 100);
        }
      });
    }
    knownIds = new Set(newOrders.map(o => o.id));
    allOrders = newOrders;
    isFirstLoad = false;
    renderOrders();
    if (selectedId) {
      const updated = allOrders.find(o => o.id === selectedId);
      if (updated) renderDetail(updated);
    }
  }, error => {
    document.getElementById('orders-grid').innerHTML = `<div class="empty-state">
      <div class="empty-icon">⚠️</div>
      <div class="empty-text" style="color:var(--danger)">خطأ في الاتصال</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:8px">
        ${error.code==='permission-denied'?'تأكد من Firestore Rules':'تأكد من الاتصال بالإنترنت'}
      </div>
    </div>`;
  });
}

// ===== EVENTS =====
document.getElementById('close-detail-btn').addEventListener('click', () => {
  selectedId = null;
  document.getElementById('detail-panel').classList.add('hidden');
  renderOrders();
});

document.getElementById('search-input').addEventListener('input', () => renderOrders());

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderOrders();
  });
});

startListening();

// ===== SIDEBAR TOGGLE =====
const sidebarToggle = document.getElementById('sidebar-toggle');
const sidebar = document.querySelector('.sidebar');
let sidebarOpen = true;

sidebarToggle.addEventListener('click', () => {
  sidebarOpen = !sidebarOpen;
  sidebar.classList.toggle('collapsed', !sidebarOpen);
  sidebarToggle.classList.toggle('collapsed', !sidebarOpen);
  sidebarToggle.textContent = sidebarOpen ? '❮' : '❯';
});
</script>
</body>
</html>
